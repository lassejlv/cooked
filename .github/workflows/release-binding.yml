# Builds @cookedjs/binding native binaries for all platforms and publishes
# the per-platform npm packages (napi-rs prebuild flow).
#
# Trigger: push a tag like binding-v0.1.1, or run manually.
# Required secret: NPM_TOKEN (npm automation token with publish rights on @cookedjs).
name: release-binding

on:
  push:
    tags: ["binding-v*"]
  workflow_dispatch:

env:
  APP_DIR: crates/cooked_napi

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-14
            target: aarch64-apple-darwin
          - host: macos-26
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: npx napi build --platform --release --target ${{ matrix.settings.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.settings.target }}
          path: ${{ env.APP_DIR }}/*.node
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: ${{ env.APP_DIR }}/artifacts
      - name: Create npm platform dirs
        working-directory: ${{ env.APP_DIR }}
        run: npx napi create-npm-dir -t .
      - name: Move artifacts
        working-directory: ${{ env.APP_DIR }}
        run: npx napi artifacts
      - name: Publish platform packages + main package
        working-directory: ${{ env.APP_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npx napi prepublish -t npm --skip-gh-release
          npm publish --access public
