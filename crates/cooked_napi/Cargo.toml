[package]
name = "cooked_napi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
cooked_compiler = { workspace = true }

[build-dependencies]
napi-build = "2"
